<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- Yellow Diamond Sign Background with Rounded Corners -->
  <rect x="25" y="25" width="150" height="150" rx="14" transform="rotate(45 100 100)" fill="#F7C82D" stroke="#1A1A1A" stroke-width="6" />
  
  <!-- Inner Diamond Border -->
  <rect x="33" y="33" width="134" height="134" rx="8" transform="rotate(45 100 100)" fill="none" stroke="#1A1A1A" stroke-width="2.5" />
  
  <!-- Center Circular Junction Outline -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-dasharray="4 2" />
  <circle cx="100" cy="100" r="30" fill="none" stroke="#1A1A1A" stroke-width="1.5" />
  
  <!-- Four Junction Bolts -->
  <circle cx="100" cy="24" r="3" fill="#1A1A1A" />
  <circle cx="100" cy="176" r="3" fill="#1A1A1A" />
  <circle cx="24" cy="100" r="3" fill="#1A1A1A" />
  <circle cx="176" cy="100" r="3" fill="#1A1A1A" />
  
  <!-- Center Name Banner -->
  <rect x="22" y="84" width="156" height="32" rx="4" fill="#F7C82D" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Cotton Junction Typography -->
  <text x="100" y="105" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-weight="900" 
        font-size="14.5" 
        letter-spacing="0.75" 
        fill="#1A1A1A" 
        text-anchor="middle">
    COTTON JUNCTION
  </text>
  
  <!-- Pure Cotton Leaf / Spindle Icon Accent at Top Center of Diamond -->
  <path d="M96 48 C96 42 100 38 100 38 C100 38 104 42 104 48 C104 52 101 54 100 54 C99 54 96 52 96 48 Z" fill="#1A1A1A" />
  
  <!-- Subtle Established Mark -->
  <text x="100" y="132" 
        font-family="'Inter', sans-serif" 
        font-weight="700" 
        font-size="8" 
        letter-spacing="1.2" 
        fill="#1A1A1A" 
        text-anchor="middle">
    EST. 2018 • INDORE
  </text>
</svg>
